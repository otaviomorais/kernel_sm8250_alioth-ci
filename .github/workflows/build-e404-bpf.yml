name: Build Alioth Kernel (E404 BPF)

on:
  schedule:
    - cron: '0 4 * * *' # Executa diariamente às 04:00 UTC
  workflow_dispatch:
    inputs:
      enable_ksu:
        description: 'Integrar KernelSU'
        required: true
        type: boolean
        default: true
      enable_susfs:
        description: 'Integrar SUSFS (Root & Process Hiding)'
        required: false
        type: boolean
        default: true
      ksu_stack:
        description: 'Stack KernelSU (legacy-v1; legacy-susfs2-experimental)'
        required: true
        type: choice
        default: legacy-v1
        options:
          - legacy-v1
          - legacy-susfs2-experimental
      force_build:
        description: 'Forçar compilação mesmo se não houver novos commits upstream'
        required: true
        type: boolean
        default: true
      enable_droidspaces:
        description: 'Habilitar suporte ao Droidspaces (LXC/Containers/Namespaces)'
        required: false
        type: boolean
        default: true
      droidspaces_profile:
        description: 'Perfil DroidSpaces (minimal; memcg; full; full-device; full-mq; full-binfmt; full-net)'
        required: true
        type: choice
        default: minimal
        options:
          - minimal
          - memcg
          - memcg-full
          - memcg-full-pids
          - memcg-full-device
          - memcg-full-mq
          - memcg-full-binfmt
          - memcg-full-net
      custom_boot_url:
        description: 'URL direta opcional de um boot.img base da sua ROM para injetar'
        required: false
        type: string
        default: ''

permissions:
  contents: write

env:
  UPSTREAM_REPO: 'kvsnr113/xiaomi_sm8250_kernel_e404'
  UPSTREAM_BRANCH: 'staging-bpf'
  DEVICE: 'alioth'
  DEFCONFIG: 'vendor/alioth_defconfig'
  BUILD_FLAGS: >-
    ARCH=arm64 SUBARCH=arm64
    CC=clang AS=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
    OBJCOPY=llvm-objcopy STRIP=llvm-strip LLVM=1 LLVM_IAS=1
    CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
    KCFLAGS=-mtune=cortex-a77

jobs:
  build:
    name: Compilar Kernel Alioth E404 BPF
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout do Repositório CI
        uses: actions/checkout@v4

      - name: Checar atualizações no upstream
        id: check_upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Consultando último commit em $UPSTREAM_REPO ($UPSTREAM_BRANCH)..."
          UPSTREAM_DATA=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$UPSTREAM_REPO/branches/$UPSTREAM_BRANCH")
          COMMIT_SHA=$(echo "$UPSTREAM_DATA" | jq -r '.commit.sha')
          COMMIT_MSG=$(echo "$UPSTREAM_DATA" | jq -r '.commit.commit.message' | head -n 1)
          COMMIT_DATE=$(echo "$UPSTREAM_DATA" | jq -r '.commit.commit.author.date')
          SHORT_SHA="${COMMIT_SHA:0:8}"

          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$COMMIT_MSG" >> "$GITHUB_OUTPUT"
          echo "commit_date=$COMMIT_DATE" >> "$GITHUB_OUTPUT"

          # Releases experimentais não podem suppressir o build agendado padrão.
          LATEST_RELEASE_TAG=$(gh release list --json tagName --jq '.[].tagName' 2>/dev/null | grep "^e404-bpf-" | grep -v "ksunext-legacy-susfs2" | head -n 1 || echo "")
          echo "Última release E404 encontrada: $LATEST_RELEASE_TAG"

          IS_MANUAL="${{ github.event_name == 'workflow_dispatch' }}"
          FORCE_BUILD="${{ github.event.inputs.force_build == 'true' }}"

          if [[ "$IS_MANUAL" == "true" && "$FORCE_BUILD" == "true" ]]; then
            echo "Execução manual com force_build=true. Prosseguindo."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$LATEST_RELEASE_TAG" && "$LATEST_RELEASE_TAG" == *"$SHORT_SHA"* ]]; then
            if [[ "$IS_MANUAL" == "true" ]]; then
              echo "Commit $SHORT_SHA já compilado, mas execução foi disparada manualmente. Prosseguindo."
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "Upstream inalterado desde a última release ($SHORT_SHA). Pulando execução agendada."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Novo commit upstream detectado: $SHORT_SHA ($COMMIT_MSG). Prosseguindo com a compilação."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Selecionar stack KernelSU/SUSFS
        id: ksu_stack
        if: steps.check_upstream.outputs.should_build == 'true'
        env:
          REQUESTED_STACK: ${{ inputs.ksu_stack || 'legacy-v1' }}
        run: |
          set -euo pipefail
          case "$REQUESTED_STACK" in
            legacy-v1)
              STACK_SLUG='legacy-v1'
              STACK_SUFFIX=''
              echo "slug=$STACK_SLUG" >> "$GITHUB_OUTPUT"
              echo "suffix=$STACK_SUFFIX" >> "$GITHUB_OUTPUT"
              echo "Stack padrão preservado: KernelSU-Next/SUSFS v1.5.5."
              ;;
            legacy-susfs2-experimental)
              STACK_SLUG='ksunext-legacy-susfs2'
              STACK_SUFFIX='-ksunext-legacy-susfs2'
              echo "slug=$STACK_SLUG" >> "$GITHUB_OUTPUT"
              echo "suffix=$STACK_SUFFIX" >> "$GITHUB_OUTPUT"
              echo "Stack experimental selecionado: KSU legacy f6a1570c + SUSFS v2.3.0."
              # The source is copied into the kernel tree, so preserve the
              # reported KSU version explicitly for the v3.4.0 manager ABI.
              echo "KSU_VERSION_OVERRIDE=33194" >> "$GITHUB_ENV"
              echo "KSU_VERSION_TAG_OVERRIDE=v3.4.0-legacy-e404" >> "$GITHUB_ENV"
              ;;
            *)
              echo "FATAL: stack KSU desconhecida: $REQUESTED_STACK" >&2
              exit 1
              ;;
          esac
          echo "KSU_STACK_SLUG=$STACK_SLUG" >> "$GITHUB_ENV"
          echo "KSU_STACK_SUFFIX=$STACK_SUFFIX" >> "$GITHUB_ENV"

      - name: Configurar Swap de 10GB
        if: steps.check_upstream.outputs.should_build == 'true'
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Instalar dependências de compilação
        if: steps.check_upstream.outputs.should_build == 'true'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential file libssl-dev libncurses-dev \
            python3 cpio rsync zip unzip jq \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            ccache

      - name: Configurar Cache do ccache
        if: steps.check_upstream.outputs.should_build == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-e404-kernel-ccache-${{ steps.check_upstream.outputs.short_sha }}
          restore-keys: |
            ${{ runner.os }}-e404-kernel-ccache-

      - name: Inicializar ccache
        if: steps.check_upstream.outputs.should_build == 'true'
        run: |
          mkdir -p ~/.ccache
          echo "max_size = 5.0G" > ~/.ccache/ccache.conf
          echo "compression = true" >> ~/.ccache/ccache.conf
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=1" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=5G" >> "$GITHUB_ENV"
          ccache -z

      - name: Configurar ZyC-Clang 16
        if: steps.check_upstream.outputs.should_build == 'true'
        run: |
          set -e
          mkdir -p "$HOME/zyc-stage"
          curl -fsSL -o "$RUNNER_TEMP/zyc.tar.gz" \
            https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
          tar -xzf "$RUNNER_TEMP/zyc.tar.gz" -C "$HOME/zyc-stage"
          ZCLANG=$(find "$HOME/zyc-stage" -name clang -print -quit)
          [ -n "$ZCLANG" ] || { echo 'FATAL: clang não encontrado no tarball'; exit 1; }
          ln -sfn "$(dirname $(dirname "$ZCLANG"))" "$HOME/zyc"
          mkdir -p "$HOME/ccache-bin"
          ln -sf "$(which ccache)" "$HOME/ccache-bin/clang"
          ln -sf "$(which ccache)" "$HOME/ccache-bin/clang++"
          echo "$HOME/ccache-bin" >> "$GITHUB_PATH"
          echo "$HOME/zyc/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/ccache-bin:$HOME/zyc/bin:$PATH"
          clang --version
          ld.lld --version

      - name: Clonar código-fonte do Kernel Upstream (E404 staging-bpf)
        if: steps.check_upstream.outputs.should_build == 'true'
        uses: actions/checkout@v4
        with:
          repository: kvsnr113/xiaomi_sm8250_kernel_e404
          ref: ${{ steps.check_upstream.outputs.commit_sha }}
          path: kernel
          fetch-depth: 1

      - name: Checkout KernelSU-Next legacy (experimental)
        if: steps.check_upstream.outputs.should_build == 'true' && (github.event.inputs.enable_ksu != 'false') && (inputs.ksu_stack == 'legacy-susfs2-experimental')
        uses: actions/checkout@v4
        with:
          repository: KernelSU-Next/KernelSU-Next
          ref: f6a1570cc7857141b8acef9b3073840f59539359
          path: ksu-legacy
          fetch-depth: 0

      - name: Checkout SUSFS v2.3 (experimental)
        if: steps.check_upstream.outputs.should_build == 'true' && (github.event.inputs.enable_ksu != 'false') && (inputs.ksu_stack == 'legacy-susfs2-experimental')
        env:
          SUSFS_COMMIT: b1de873fff29c3e1eebe643d6cab94af91f07217
        run: |
          set -euo pipefail
          git init susfs-v2
          git -C susfs-v2 remote add origin https://gitlab.com/simonpunk/susfs4ksu.git
          git -C susfs-v2 fetch --depth 1 origin "$SUSFS_COMMIT"
          git -C susfs-v2 checkout --detach FETCH_HEAD
          test "$(git -C susfs-v2 rev-parse HEAD)" = "$SUSFS_COMMIT"
          grep -q '#define SUSFS_VERSION "v2.3.0"' susfs-v2/kernel_patches/include/linux/susfs.h

      - name: Integrar KernelSU + SUSFS (E404)
        if: steps.check_upstream.outputs.should_build == 'true' && (github.event.inputs.enable_ksu != 'false')
        env:
          KSU_STACK: ${{ inputs.ksu_stack || 'legacy-v1' }}
          ENABLE_SUSFS: ${{ github.event.inputs.enable_susfs }}
        run: |
          set -euo pipefail
          ENABLE_SUSFS="${ENABLE_SUSFS:-true}"
          if [ "$KSU_STACK" = "legacy-susfs2-experimental" ]; then
            echo "Aplicando port experimental KSU-Next legacy + SUSFS v2.3 no E404..."
            bash kernelsu/apply_e404_legacy_susfs2.sh \
              kernel \
              kernel/arch/arm64/configs/vendor/alioth_defconfig \
              ksu-legacy \
              susfs-v2 \
              "$ENABLE_SUSFS"
          else
            echo "Aplicando integração KernelSU no E404 (stack legado; SUSFS: $ENABLE_SUSFS)..."
            bash kernelsu/apply_e404.sh kernel "$ENABLE_SUSFS" kernel/arch/arm64/configs/vendor/alioth_defconfig
          fi

      - name: Validar stack KSU/SUSFS experimental
        if: steps.check_upstream.outputs.should_build == 'true' && (github.event.inputs.enable_ksu != 'false') && (github.event.inputs.enable_susfs != 'false') && (inputs.ksu_stack == 'legacy-susfs2-experimental')
        run: |
          set -euo pipefail
          F=kernel/arch/arm64/configs/vendor/alioth_defconfig
          grep -q '^CONFIG_KSU=y' "$F"
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y' "$F"
          ! grep -q '^CONFIG_KSU_KPROBES_HOOK=y' "$F"
          ! grep -q '^CONFIG_KSU_SYSCALL_TABLE_HOOK=y' "$F"
          grep -q '^CONFIG_KSU_SUSFS=y' "$F"
          grep -q '#define SUSFS_VERSION "v2.3.0"' kernel/include/linux/susfs.h
          grep -q 'ksu_handle_execveat' kernel/fs/exec.c
          grep -q 'ksu_handle_sys_reboot' kernel/kernel/reboot.c
          test -z "$(find kernel -type f -name '*.rej' -print -quit)"
          echo 'Stack experimental validada antes da geração do .config.'

      - name: Selecionar perfil do Droidspaces
        id: droidspaces_profile
        if: steps.check_upstream.outputs.should_build == 'true' && (github.event.inputs.enable_droidspaces != 'false')
        env:
          REQUESTED_PROFILE: ${{ inputs.droidspaces_profile || 'minimal' }}
        run: |
          set -euo pipefail
          case "$REQUESTED_PROFILE" in
            minimal)
              DROIDSPACES_CONFIG='droidspaces/droidspaces-minimal.config'
              PROFILE_LABEL='minimal'
              ;;
            memcg)
              DROIDSPACES_CONFIG='droidspaces/droidspaces-memcg-safe.config'
              PROFILE_LABEL='memcg-safe'
              ;;
            memcg-full)
              DROIDSPACES_CONFIG='droidspaces/droidspaces-memcg-full.config'
              PROFILE_LABEL='memcg-full'
              ;;
            memcg-full-pids)
              DROIDSPACES_CONFIG='droidspaces/droidspaces-memcg-full-pids.config'
              PROFILE_LABEL='memcg-full-pids'
              ;;
            memcg-full-device)
              DROIDSPACES_CONFIG='droidspaces/droidspaces-memcg-full-device.config'
              PROFILE_LABEL='memcg-full-device'
              ;;
            memcg-full-mq)
              DROIDSPACES_CONFIG='droidspaces/droidspaces-memcg-full-mq.config'
              PROFILE_LABEL='memcg-full-mq'
              ;;
            memcg-full-binfmt)
              DROIDSPACES_CONFIG='droidspaces/droidspaces-memcg-full-binfmt.config'
              PROFILE_LABEL='memcg-full-binfmt'
              ;;
            memcg-full-net)
              DROIDSPACES_CONFIG='droidspaces/droidspaces-memcg-full-net.config'
              PROFILE_LABEL='memcg-full-net'
              ;;
            *)
              echo "FATAL: perfil Droidspaces desconhecido: $REQUESTED_PROFILE" >&2
              exit 1
              ;;
          esac
          echo "Perfil Droidspaces: $PROFILE_LABEL ($DROIDSPACES_CONFIG)"
          echo "config=$DROIDSPACES_CONFIG" >> "$GITHUB_OUTPUT"
          echo "label=$PROFILE_LABEL" >> "$GITHUB_OUTPUT"
          echo "DROIDSPACES_PROFILE=$PROFILE_LABEL" >> "$GITHUB_ENV"

      - name: Integrar Suporte ao Droidspaces
        if: steps.check_upstream.outputs.should_build == 'true' && (github.event.inputs.enable_droidspaces != 'false')
        env:
          DROIDSPACES_CONFIG: ${{ steps.droidspaces_profile.outputs.config }}
          PROFILE_LABEL: ${{ steps.droidspaces_profile.outputs.label }}
        run: |
          set -euo pipefail
          echo "Aplicando perfil Droidspaces '$PROFILE_LABEL'..."
          bash droidspaces/apply.sh kernel kernel/arch/arm64/configs/vendor/alioth_defconfig "$DROIDSPACES_CONFIG"

      - name: Ajustar Droidspaces para E404 (scheduler e extensions de MEMCG)
        if: steps.check_upstream.outputs.should_build == 'true' && (github.event.inputs.enable_droidspaces != 'false')
        env:
          PROFILE_LABEL: ${{ steps.droidspaces_profile.outputs.label }}
        run: |
          set -euo pipefail
          # O scheduler EEVDF/CASS do E404 nao compila com FAIR_GROUP_SCHED/CFS_BANDWIDTH
          # (fair.c usa simbolos removidos: qcfs_rq, pelt_clock_throttled).
          F=kernel/arch/arm64/configs/vendor/alioth_defconfig
          sed -i '/CONFIG_FAIR_GROUP_SCHED/d; /CONFIG_CFS_BANDWIDTH/d; /CONFIG_RT_GROUP_SCHED/d' "$F"
          printf '# CONFIG_FAIR_GROUP_SCHED is not set\n# CONFIG_CFS_BANDWIDTH is not set\n# CONFIG_RT_GROUP_SCHED is not set\n' >> "$F"

          if [ "$PROFILE_LABEL" = "memcg-safe" ]; then
            # No perfil memcg-safe mantemos apenas o controlador basico de paginas.
            # Estes sub-controladores alteram SLUB, swap/zRAM e throttling de
            # writeback; sao desativados para isolar o boot sem remover o memcg.
            sed -i '/CONFIG_MEMCG_KMEM/d; /CONFIG_MEMCG_SWAP/d; /CONFIG_CGROUP_WRITEBACK/d; /CONFIG_SLUB_MEMCG_SYSFS_ON/d' "$F"
            printf '# CONFIG_MEMCG_KMEM is not set\n# CONFIG_MEMCG_SWAP is not set\n# CONFIG_MEMCG_SWAP_ENABLED is not set\n# CONFIG_CGROUP_WRITEBACK is not set\n# CONFIG_SLUB_MEMCG_SYSFS_ON is not set\n' >> "$F"
            echo "Group-sched desabilitado; perfil '$PROFILE_LABEL' com extensoes de MEMCG desabilitadas."
          else
            echo "Group-sched desabilitado; perfil '$PROFILE_LABEL' preserva as extensoes de MEMCG solicitadas."
          fi
          grep -E '^(CONFIG_MEMCG|# CONFIG_MEMCG|# CONFIG_CGROUP_WRITEBACK|# CONFIG_SLUB_MEMCG)' "$F" || true

      - name: Aplicar correções do perfil MEMCG no E404
        if: steps.check_upstream.outputs.should_build == 'true' && (github.event.inputs.enable_droidspaces != 'false') && (steps.droidspaces_profile.outputs.label == 'memcg-safe' || steps.droidspaces_profile.outputs.label == 'memcg-full' || steps.droidspaces_profile.outputs.label == 'memcg-full-pids' || steps.droidspaces_profile.outputs.label == 'memcg-full-device' || steps.droidspaces_profile.outputs.label == 'memcg-full-mq' || steps.droidspaces_profile.outputs.label == 'memcg-full-binfmt' || steps.droidspaces_profile.outputs.label == 'memcg-full-net')
        env:
          PROFILE_LABEL: ${{ steps.droidspaces_profile.outputs.label }}
        run: |
          set -euo pipefail
          PATCHES=(
            "$GITHUB_WORKSPACE/droidspaces/patches/03.e404_fix_memcg_without_kmem.patch"
          )
          if [ "$PROFILE_LABEL" = "memcg-safe" ]; then
            PATCHES=(
              "$GITHUB_WORKSPACE/droidspaces/patches/02.e404_memcg_safe_kconfig.patch"
              "$GITHUB_WORKSPACE/droidspaces/patches/03.e404_fix_memcg_without_kmem.patch"
            )
          fi
          for patch in "${PATCHES[@]}"; do
            (cd kernel && git apply --check "$patch")
            (cd kernel && git apply "$patch")
          done
          echo 'Defaults/guards de MEMCG corrigidos para o perfil selecionado.'

      - name: Verificar Droidspaces no defconfig (pré-build)
        if: steps.check_upstream.outputs.should_build == 'true' && (github.event.inputs.enable_droidspaces != 'false')
        env:
          PROFILE_LABEL: ${{ steps.droidspaces_profile.outputs.label }}
        run: |
          set -euo pipefail
          F=kernel/arch/arm64/configs/vendor/alioth_defconfig
          echo "Verificando perfil '$PROFILE_LABEL' em $F..."
          grep -q '^CONFIG_USER_NS=y' "$F" || { echo 'FATAL: CONFIG_USER_NS=y ausente no defconfig.'; exit 1; }
          case "$PROFILE_LABEL" in
            minimal)
              if grep -q '^CONFIG_MEMCG=y' "$F"; then
                echo 'FATAL: o perfil minimal nao pode ativar MEMCG.'
                exit 1
              fi
              ;;
            memcg-safe)
              grep -q '^CONFIG_MEMCG=y' "$F" || { echo 'FATAL: CONFIG_MEMCG=y ausente no perfil memcg-safe.'; exit 1; }
              for symbol in MEMCG_KMEM MEMCG_SWAP CGROUP_WRITEBACK SLUB_MEMCG_SYSFS_ON; do
                if grep -q "^CONFIG_${symbol}=y" "$F"; then
                  echo "FATAL: extensão perigosa ainda ativa: CONFIG_${symbol}=y"
                  exit 1
                fi
              done
              ;;
            memcg-full)
              grep -q '^CONFIG_MEMCG=y' "$F" || { echo 'FATAL: CONFIG_MEMCG=y ausente no perfil memcg-full.'; exit 1; }
              for symbol in MEMCG_KMEM MEMCG_SWAP MEMCG_SWAP_ENABLED CGROUP_WRITEBACK SLUB_MEMCG_SYSFS_ON; do
                grep -q "^CONFIG_${symbol}=y" "$F" || { echo "FATAL: CONFIG_${symbol}=y ausente no perfil memcg-full."; exit 1; }
              done
              ;;
            memcg-full-pids)
              grep -q '^CONFIG_MEMCG=y' "$F" || { echo 'FATAL: CONFIG_MEMCG=y ausente no perfil memcg-full-pids.'; exit 1; }
              for symbol in MEMCG_KMEM MEMCG_SWAP MEMCG_SWAP_ENABLED CGROUP_WRITEBACK SLUB_MEMCG_SYSFS_ON CGROUP_PIDS; do
                grep -q "^CONFIG_${symbol}=y" "$F" || { echo "FATAL: CONFIG_${symbol}=y ausente no perfil memcg-full-pids."; exit 1; }
              done
              if grep -q '^CONFIG_CGROUP_DEVICE=y' "$F"; then
                echo 'FATAL: CGROUP_DEVICE nao deve ser ativado no bloco PIDS.'
                exit 1
              fi
              ;;
            memcg-full-device)
              grep -q '^CONFIG_MEMCG=y' "$F" || { echo 'FATAL: CONFIG_MEMCG=y ausente no perfil memcg-full-device.'; exit 1; }
              for symbol in MEMCG_KMEM MEMCG_SWAP MEMCG_SWAP_ENABLED CGROUP_WRITEBACK SLUB_MEMCG_SYSFS_ON CGROUP_PIDS CGROUP_DEVICE; do
                grep -q "^CONFIG_${symbol}=y" "$F" || { echo "FATAL: CONFIG_${symbol}=y ausente no perfil memcg-full-device."; exit 1; }
              done
              ;;
            memcg-full-mq)
              grep -q '^CONFIG_MEMCG=y' "$F" || { echo 'FATAL: CONFIG_MEMCG=y ausente no perfil memcg-full-mq.'; exit 1; }
              for symbol in MEMCG_KMEM MEMCG_SWAP MEMCG_SWAP_ENABLED CGROUP_WRITEBACK SLUB_MEMCG_SYSFS_ON CGROUP_PIDS CGROUP_DEVICE POSIX_MQUEUE; do
                grep -q "^CONFIG_${symbol}=y" "$F" || { echo "FATAL: CONFIG_${symbol}=y ausente no perfil memcg-full-mq."; exit 1; }
              done
              ;;
            memcg-full-binfmt)
              grep -q '^CONFIG_MEMCG=y' "$F" || { echo 'FATAL: CONFIG_MEMCG=y ausente no perfil memcg-full-binfmt.'; exit 1; }
              for symbol in MEMCG_KMEM MEMCG_SWAP MEMCG_SWAP_ENABLED CGROUP_WRITEBACK SLUB_MEMCG_SYSFS_ON CGROUP_PIDS CGROUP_DEVICE POSIX_MQUEUE BINFMT_MISC; do
                grep -q "^CONFIG_${symbol}=y" "$F" || { echo "FATAL: CONFIG_${symbol}=y ausente no perfil memcg-full-binfmt."; exit 1; }
              done
              ;;
            memcg-full-net)
              grep -q '^CONFIG_MEMCG=y' "$F" || { echo 'FATAL: CONFIG_MEMCG=y ausente no perfil memcg-full-net.'; exit 1; }
              for symbol in MEMCG_KMEM MEMCG_SWAP MEMCG_SWAP_ENABLED CGROUP_WRITEBACK SLUB_MEMCG_SYSFS_ON CGROUP_PIDS CGROUP_DEVICE POSIX_MQUEUE BINFMT_MISC BRIDGE_NETFILTER NETFILTER_XT_MATCH_ADDRTYPE; do
                grep -q "^CONFIG_${symbol}=y" "$F" || { echo "FATAL: CONFIG_${symbol}=y ausente no perfil memcg-full-net."; exit 1; }
              done
              ;;
            *)
              echo "FATAL: perfil invalido: $PROFILE_LABEL" >&2
              exit 1
              ;;
          esac
          grep -E '^(CONFIG_(USER_NS|MEMCG|NAMESPACES|PID_NS|UTS_NS|IPC_NS|NET_NS)|# CONFIG_(MEMCG_KMEM|MEMCG_SWAP|CGROUP_WRITEBACK))' "$F" || true
          echo "Perfil Droidspaces OK no defconfig."

      - name: Aplicar Otimizações de Kernel (BBR, ZSTD, Kyber, PSI)
        if: steps.check_upstream.outputs.should_build == 'true'
        run: |
          set -e
          echo "Aplicando otimizações de performance..."
          bash tools/apply_optimizations.sh kernel kernel/arch/arm64/configs/vendor/alioth_defconfig

      - name: Ajustar flags do Makefile do Kernel (compatibilidade Clang)
        if: steps.check_upstream.outputs.should_build == 'true'
        run: |
          set -e
          echo "Aplicando correções de flags do Clang no Makefile..."
          sed -i 's/-flto=thin -fsplit-lto-unit -funified-lto/-flto=thin -fsplit-lto-unit \$(call cc-option,-funified-lto)/g' kernel/Makefile
          sed -i 's/CC_FLAGS_LTO\t+= -fsplit-machine-functions/CC_FLAGS_LTO\t+= \$(call cc-option,-fsplit-machine-functions)/g' kernel/Makefile
          sed -i 's/> \/dev\/null/> \/dev\/null 2>\&1 || true/' kernel/scripts/checksyscalls.sh

      - name: Configurar ferramentas de dtbo (mkdtboimg)
        if: steps.check_upstream.outputs.should_build == 'true'
        run: |
          set -e
          sudo ln -sf /usr/bin/python3 /usr/bin/python2 || true
          mkdir -p kernel/scripts/ufdt/libufdt/utils/src
          cp -f tools/mkdtboimg.py kernel/scripts/ufdt/libufdt/utils/src/mkdtboimg.py
          chmod +x kernel/scripts/ufdt/libufdt/utils/src/mkdtboimg.py
          sed -i 's/python2 \$(MKDTBO)/python3 \$(MKDTBO)/g' kernel/scripts/Makefile.lib 2>/dev/null || true

      - name: Gerar defconfig
        if: steps.check_upstream.outputs.should_build == 'true'
        run: |
          set -e
          cd kernel
          make -j$(nproc) O=out $BUILD_FLAGS $DEFCONFIG

      - name: Verificar Droidspaces no .config final
        if: steps.check_upstream.outputs.should_build == 'true' && (github.event.inputs.enable_droidspaces != 'false')
        env:
          PROFILE_LABEL: ${{ steps.droidspaces_profile.outputs.label }}
        run: |
          set -euo pipefail
          F=kernel/out/.config
          echo "Verificando perfil '$PROFILE_LABEL' no .config final..."
          grep -q '^CONFIG_USER_NS=y' "$F" || { echo 'FATAL: CONFIG_USER_NS=y ausente no .config final.'; exit 1; }
          case "$PROFILE_LABEL" in
            minimal)
              if grep -q '^CONFIG_MEMCG=y' "$F"; then
                echo 'FATAL: o perfil minimal terminou com MEMCG ligado.'
                exit 1
              fi
              ;;
            memcg-safe)
              grep -q '^CONFIG_MEMCG=y' "$F" || { echo 'FATAL: Kconfig removeu CONFIG_MEMCG=y.'; exit 1; }
              for symbol in MEMCG_KMEM MEMCG_SWAP CGROUP_WRITEBACK SLUB_MEMCG_SYSFS_ON; do
                if grep -q "^CONFIG_${symbol}=y" "$F"; then
                  echo "FATAL: Kconfig reativou CONFIG_${symbol}=y"
                  exit 1
                fi
              done
              ;;
            memcg-full)
              grep -q '^CONFIG_MEMCG=y' "$F" || { echo 'FATAL: Kconfig removeu CONFIG_MEMCG=y.'; exit 1; }
              for symbol in MEMCG_KMEM MEMCG_SWAP MEMCG_SWAP_ENABLED CGROUP_WRITEBACK SLUB_MEMCG_SYSFS_ON; do
                grep -q "^CONFIG_${symbol}=y" "$F" || { echo "FATAL: Kconfig removeu CONFIG_${symbol}=y."; exit 1; }
              done
              ;;
            memcg-full-pids)
              grep -q '^CONFIG_MEMCG=y' "$F" || { echo 'FATAL: Kconfig removeu CONFIG_MEMCG=y.'; exit 1; }
              for symbol in MEMCG_KMEM MEMCG_SWAP MEMCG_SWAP_ENABLED CGROUP_WRITEBACK SLUB_MEMCG_SYSFS_ON CGROUP_PIDS; do
                grep -q "^CONFIG_${symbol}=y" "$F" || { echo "FATAL: Kconfig removeu CONFIG_${symbol}=y."; exit 1; }
              done
              if grep -q '^CONFIG_CGROUP_DEVICE=y' "$F"; then
                echo 'FATAL: CGROUP_DEVICE nao deve ser ativado no bloco PIDS.'
                exit 1
              fi
              ;;
            memcg-full-device)
              grep -q '^CONFIG_MEMCG=y' "$F" || { echo 'FATAL: Kconfig removeu CONFIG_MEMCG=y.'; exit 1; }
              for symbol in MEMCG_KMEM MEMCG_SWAP MEMCG_SWAP_ENABLED CGROUP_WRITEBACK SLUB_MEMCG_SYSFS_ON CGROUP_PIDS CGROUP_DEVICE; do
                grep -q "^CONFIG_${symbol}=y" "$F" || { echo "FATAL: Kconfig removeu CONFIG_${symbol}=y."; exit 1; }
              done
              ;;
            memcg-full-mq)
              grep -q '^CONFIG_MEMCG=y' "$F" || { echo 'FATAL: Kconfig removeu CONFIG_MEMCG=y.'; exit 1; }
              for symbol in MEMCG_KMEM MEMCG_SWAP MEMCG_SWAP_ENABLED CGROUP_WRITEBACK SLUB_MEMCG_SYSFS_ON CGROUP_PIDS CGROUP_DEVICE POSIX_MQUEUE; do
                grep -q "^CONFIG_${symbol}=y" "$F" || { echo "FATAL: Kconfig removeu CONFIG_${symbol}=y."; exit 1; }
              done
              ;;
            memcg-full-binfmt)
              grep -q '^CONFIG_MEMCG=y' "$F" || { echo 'FATAL: Kconfig removeu CONFIG_MEMCG=y.'; exit 1; }
              for symbol in MEMCG_KMEM MEMCG_SWAP MEMCG_SWAP_ENABLED CGROUP_WRITEBACK SLUB_MEMCG_SYSFS_ON CGROUP_PIDS CGROUP_DEVICE POSIX_MQUEUE BINFMT_MISC; do
                grep -q "^CONFIG_${symbol}=y" "$F" || { echo "FATAL: Kconfig removeu CONFIG_${symbol}=y."; exit 1; }
              done
              ;;
            memcg-full-net)
              grep -q '^CONFIG_MEMCG=y' "$F" || { echo 'FATAL: Kconfig removeu CONFIG_MEMCG=y.'; exit 1; }
              for symbol in MEMCG_KMEM MEMCG_SWAP MEMCG_SWAP_ENABLED CGROUP_WRITEBACK SLUB_MEMCG_SYSFS_ON CGROUP_PIDS CGROUP_DEVICE POSIX_MQUEUE BINFMT_MISC BRIDGE_NETFILTER NETFILTER_XT_MATCH_ADDRTYPE; do
                grep -q "^CONFIG_${symbol}=y" "$F" || { echo "FATAL: Kconfig removeu CONFIG_${symbol}=y."; exit 1; }
              done
              ;;
            *)
              echo "FATAL: perfil invalido: $PROFILE_LABEL" >&2
              exit 1
              ;;
          esac
          grep -E '^(CONFIG_(USER_NS|MEMCG|NAMESPACES|PID_NS|UTS_NS|IPC_NS|NET_NS|OVERLAY_FS|CGROUPS|SECCOMP)|# CONFIG_(MEMCG_KMEM|MEMCG_SWAP|CGROUP_WRITEBACK))' "$F" || true
          echo "Perfil '$PROFILE_LABEL' confirmado no .config final."

      - name: Compilar Kernel (Image, dtbs, dtbo.img)
        if: steps.check_upstream.outputs.should_build == 'true'
        run: |
          set -e
          cd kernel
          make -j$(nproc) O=out $BUILD_FLAGS Image dtbs dtbo.img

      - name: Exibir Estatísticas do ccache
        if: steps.check_upstream.outputs.should_build == 'true'
        run: |
          ccache -s

      - name: Coletar artefatos de saída
        if: steps.check_upstream.outputs.should_build == 'true'
        run: |
          set -e
          mkdir -p dist
          cp kernel/out/arch/arm64/boot/Image dist/Image
          cp kernel/out/arch/arm64/boot/dtbo.img dist/dtbo.img
          cat kernel/out/arch/arm64/boot/dts/vendor/qcom/*.dtb > dist/dtb
          cp kernel/out/.config dist/kernel-config
          test -s dist/Image
          test -s dist/dtb
          test -s dist/dtbo.img
          echo "Binários do Kernel E404 gerados com sucesso."

      - name: Empacotar AnyKernel3 Zip Flashável
        if: steps.check_upstream.outputs.should_build == 'true'
        run: |
          set -e
          SHORT_SHA="${{ steps.check_upstream.outputs.short_sha }}"
          PROFILE_LABEL="${DROIDSPACES_PROFILE:-off}"
          AK3_DIR="ak3_pack"
          cp -r anykernel "$AK3_DIR"
          cp dist/Image "$AK3_DIR/Image"
          cp dist/dtb "$AK3_DIR/dtb"
          cp dist/dtbo.img "$AK3_DIR/dtbo.img"
          chmod 755 "$AK3_DIR/META-INF/com/google/android/update-binary"

          ZIP_NAME="AnyKernel3-Alioth-E404-BPF-${SHORT_SHA}-${PROFILE_LABEL}${KSU_STACK_SUFFIX:-}.zip"
          cd "$AK3_DIR"
          zip -r -X "../dist/$ZIP_NAME" .
          cd ..
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          unzip -l "dist/$ZIP_NAME"

      - name: Preparar magiskboot e Gerar boot.img
        if: steps.check_upstream.outputs.should_build == 'true'
        env:
          CUSTOM_BOOT_URL: ${{ inputs.custom_boot_url }}
        run: |
          set -e
          mkdir -p boot_pack
          cd boot_pack

          curl -fsSL -o magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk
          unzip -p magisk.apk lib/x86_64/libmagiskboot.so > magiskboot
          chmod +x magiskboot

          if [ -n "$CUSTOM_BOOT_URL" ]; then
            echo "Baixando boot.img customizado da URL fornecida."
            curl -fsSL -o base_boot.img -- "$CUSTOM_BOOT_URL"
          else
            echo "Baixando boot.img base do Alioth AOSP..."
            curl -fsSL -o boot.zip https://raw.githubusercontent.com/sakana164/Build-Kernel-Action/main/boot.zip
            unzip -q boot.zip
            mv boot.img base_boot.img
          fi

          echo "Descompactando boot.img base..."
          ./magiskboot unpack base_boot.img

          echo "Injetando novo Image e device tree..."
          cp ../dist/Image kernel
          if [ -f dtb ]; then
            cp ../dist/dtb dtb
            echo 'Device tree standalone (dtb) substituído.'
          elif [ -f dt ]; then
            cp ../dist/dtb dt
            echo 'Device tree legado (dt) substituído.'
          else
            echo 'boot.img base não possui dtb/dt standalone; preservando o formato original.'
          fi

          echo "Reempacotando boot.img..."
          ./magiskboot repack base_boot.img ../dist/boot.img
          cd ..
          test -s dist/boot.img
          echo "boot.img gerado com sucesso."

      - name: Upload de Artefatos no GitHub Actions
        if: steps.check_upstream.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: alioth-e404-bpf-${{ steps.check_upstream.outputs.short_sha }}-${{ steps.droidspaces_profile.outputs.label || 'off' }}${{ steps.ksu_stack.outputs.suffix }}
          path: dist/
          retention-days: 14

      - name: Criar GitHub Release
        if: steps.check_upstream.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          SHORT_SHA="${{ steps.check_upstream.outputs.short_sha }}"
          FULL_SHA="${{ steps.check_upstream.outputs.commit_sha }}"
          COMMIT_MSG="${{ steps.check_upstream.outputs.commit_msg }}"
          PROFILE_LABEL="${DROIDSPACES_PROFILE:-off}"
          STACK_SUFFIX="${KSU_STACK_SUFFIX:-}"
          BUILD_DATE=$(date -u +'%Y-%m-%d')
          TAG_NAME="e404-bpf-${BUILD_DATE}-${SHORT_SHA}-${PROFILE_LABEL}${STACK_SUFFIX}"

          KSU_STATUS="Ativado (KernelSU-Next + SUSFS v1.5.5 completo: SUS Maps, Try Umount, Open Redirect, Auto Try Umount Bind, Hide Symbols, OverlayFS Auto Kstat)"
          if [ "${{ inputs.ksu_stack || 'legacy-v1' }}" = "legacy-susfs2-experimental" ] && [ "${{ github.event.inputs.enable_ksu }}" != "false" ]; then
            KSU_STATUS="EXPERIMENTAL (KernelSU-Next legacy f6a1570c + SUSFS v2.3.0; hooks manuais; requer manager v3.4.0)"
          elif [ "${{ github.event.inputs.enable_ksu }}" = "false" ]; then
            KSU_STATUS="Desativado"
          elif [ "${{ github.event.inputs.enable_susfs }}" = "false" ]; then
            KSU_STATUS="Ativado (KernelSU-Next sem SUSFS)"
          fi

          if [ "${{ github.event.inputs.enable_droidspaces }}" = "false" ]; then
            DROIDSPACES_STATUS="Desativado"
          elif [ "$PROFILE_LABEL" = "memcg-safe" ]; then
            DROIDSPACES_STATUS="Isolamento MEMCG (MEMCG basico; KMEM, swap-accounting, cgroup writeback e CFS bandwidth desativados)"
          elif [ "$PROFILE_LABEL" = "memcg-full" ]; then
            DROIDSPACES_STATUS="MEMCG completo (KMEM, swap-accounting, cgroup writeback e sysfs SLUB ativados; CGROUP_DEVICE/PIDS ainda desativados)"
          elif [ "$PROFILE_LABEL" = "memcg-full-pids" ]; then
            DROIDSPACES_STATUS="Bloco 1: MEMCG completo + CGROUP_PIDS; CGROUP_DEVICE e demais blocos ainda desativados"
          elif [ "$PROFILE_LABEL" = "memcg-full-device" ]; then
            DROIDSPACES_STATUS="Bloco 2: MEMCG completo + CGROUP_PIDS + CGROUP_DEVICE; demais blocos ainda desativados"
          elif [ "$PROFILE_LABEL" = "memcg-full-mq" ]; then
            DROIDSPACES_STATUS="Bloco 3: MEMCG completo + CGROUP_PIDS + CGROUP_DEVICE + POSIX_MQUEUE"
          elif [ "$PROFILE_LABEL" = "memcg-full-binfmt" ]; then
            DROIDSPACES_STATUS="Bloco 4: MEMCG completo + CGROUP_PIDS + CGROUP_DEVICE + POSIX_MQUEUE + BINFMT_MISC"
          elif [ "$PROFILE_LABEL" = "memcg-full-net" ]; then
            DROIDSPACES_STATUS="Bloco 5: perfil validado + BRIDGE_NETFILTER + XT_MATCH_ADDRTYPE para rede NAT"
          else
            DROIDSPACES_STATUS="Minimo (apenas USER_NS; baseline booteavel)"
          fi

          cat <<EOF > release_notes.md
          # Alioth Kernel E404 BPF (Poco F3 / Redmi K40)

          Compilação de alta performance baseada no kernel [kvsnr113/xiaomi_sm8250_kernel_e404](https://github.com/kvsnr113/xiaomi_sm8250_kernel_e404/tree/staging-bpf).

          ### Destaques da Base E404 BPF
          - **Agendador:** EEVDF + CASS (Qualcomm WALT totalmente removido, latência de agendamento ultra-baixa).
          - **Compatibilidade A16+ / A17:** Backport massivo de eBPF do Linux 5.15 com spoofing inteligente de uname para daemons de sistema.
          - **GPU & Hardware:** Otimizações Adreno KGSL por Hilmiy, Bypass Charging (\`smb5-lib\`) e proteção contra sobretensão na bateria.
          - **KernelSU / SUSFS:** ${KSU_STATUS}
          - **Droidspaces Support:** ${DROIDSPACES_STATUS}
          - **Otimizações:** TCP Google BBR, ZSTD (zRAM), Kyber I/O (UFS 3.1), PSI

          ### Informações do Build
          - **Upstream Commit:** [\`${SHORT_SHA}\`](https://github.com/kvsnr113/xiaomi_sm8250_kernel_e404/commit/${FULL_SHA})
          - **Mensagem Upstream:** ${COMMIT_MSG}
          - **Branch Base:** \`staging-bpf\`
          - **Perfil Droidspaces:** \`${PROFILE_LABEL}\`
          - **Stack KSU/SUSFS:** \`${KSU_STACK_SLUG:-legacy-v1}\`
          - **Toolchain:** ZyC-Clang 16 (ThinLTO + CFI + ccache + Cortex-A77 tune)

          ---

          ### Como Instalar (Métodos de Flash)

          #### Opção 1: Via Recovery (TWRP / OrangeFox) — **Recomendado**
          1. Baixe o pacote **\`${ZIP_NAME}\`**.
          2. No recovery, instale o arquivo zip normalmente. Ele preserva o ramdisk da sua ROM atual, atualiza o kernel na partição \`boot\` e grava a partição \`dtbo\`.

          #### Opção 2: Via Fastboot
          1. Baixe os arquivos **\`boot.img\`** e **\`dtbo.img\`**.
          2. Conecte o aparelho em modo Fastboot e execute no computador/Termux:
          \`\`\`bash
          fastboot flash boot boot.img
          fastboot flash dtbo dtbo.img
          fastboot reboot
          \`\`\`
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME já existe. Atualizando notas e substituindo arquivos..."
            gh release edit "$TAG_NAME" \
              --title "Alioth Kernel E404 BPF (${BUILD_DATE} - ${SHORT_SHA} - ${PROFILE_LABEL}${STACK_SUFFIX})" \
              --notes-file release_notes.md
            gh release upload "$TAG_NAME" \
              dist/"$ZIP_NAME" \
              dist/boot.img \
              dist/dtbo.img \
              dist/Image \
              --clobber
          else
            gh release create "$TAG_NAME" \
              dist/"$ZIP_NAME" \
              dist/boot.img \
              dist/dtbo.img \
              dist/Image \
              --title "Alioth Kernel E404 BPF (${BUILD_DATE} - ${SHORT_SHA} - ${PROFILE_LABEL}${STACK_SUFFIX})" \
              --notes-file release_notes.md
          fi
