name: Build Alioth Kernel (MagicTime + KernelSU-Next/SUSFS)

on:
  workflow_dispatch:
    inputs:
      droidspaces_profile:
        description: 'Perfil opcional de containers: none ou lxc'
        required: true
        type: choice
        default: none
        options:
          - none
          - lxc

permissions:
  contents: read

env:
  MAGIC_REPO: 'TIMISONG-dev/kernel_xiaomi_sm8250'
  MAGIC_SHA: 'eba8dbd9d11b479cae68918826c344065a6b5d3c'
  DEFCONFIG: 'alioth_defconfig'
  BUILD_FLAGS: >-
    ARCH=arm64 SUBARCH=arm64
    CC=clang AS=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
    OBJCOPY=llvm-objcopy STRIP=llvm-strip LLVM=1 LLVM_IAS=1
    CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
    KCFLAGS=-mtune=cortex-a77

jobs:
  build:
    name: Compilar MagicTime com KernelSU-Next + SUSFS
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout do Repositório CI
        uses: actions/checkout@v4

      - name: Configurar Swap de 10GB
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Instalar dependências
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential file libssl-dev libncurses-dev \
            python3 cpio rsync zip unzip jq \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            ccache

      - name: Configurar cache do ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-magictime-ksu-next-${{ env.MAGIC_SHA }}-${{ inputs.droidspaces_profile }}
          restore-keys: |
            ${{ runner.os }}-magictime-ksu-next-${{ env.MAGIC_SHA }}-

      - name: Instalar ZyC-Clang 16
        run: |
          set -e
          mkdir -p "$HOME/zyc-stage"
          curl -fsSL -o "$RUNNER_TEMP/zyc.tar.gz" \
            https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
          tar -xzf "$RUNNER_TEMP/zyc.tar.gz" -C "$HOME/zyc-stage"
          ZCLANG=$(find "$HOME/zyc-stage" -name clang -print -quit)
          test -n "$ZCLANG"
          ln -sfn "$(dirname "$(dirname "$ZCLANG")")" "$HOME/zyc"
          mkdir -p "$HOME/ccache-bin"
          ln -sf "$(command -v ccache)" "$HOME/ccache-bin/clang"
          ln -sf "$(command -v ccache)" "$HOME/ccache-bin/clang++"
          echo "$HOME/ccache-bin" >> "$GITHUB_PATH"
          echo "$HOME/zyc/bin" >> "$GITHUB_PATH"

      - name: Checkout MagicTime exato
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MAGIC_REPO }}
          ref: ${{ env.MAGIC_SHA }}
          path: kernel
          fetch-depth: 1
          submodules: false

      - name: Configurar ferramentas de dtbo (mkdtboimg)
        run: |
          set -e
          sudo ln -sf /usr/bin/python3 /usr/bin/python2
          mkdir -p kernel/scripts/ufdt/libufdt/utils/src
          cp -f tools/mkdtboimg.py kernel/scripts/ufdt/libufdt/utils/src/mkdtboimg.py
          chmod +x kernel/scripts/ufdt/libufdt/utils/src/mkdtboimg.py
          sed -i 's/python2 \$(MKDTBO)/python3 \$(MKDTBO)/g' kernel/scripts/Makefile.lib

      - name: Remover KernelSU embutido e instalar KernelSU-Next + SUSFS
        run: bash magictime/apply-kernelsu-next-susfs.sh kernel

      - name: Aplicar perfil LXC opcional
        if: ${{ inputs.droidspaces_profile == 'lxc' }}
        run: |
          set -e
          bash droidspaces/apply.sh \
            kernel \
            kernel/arch/arm64/configs/alioth_defconfig \
            droidspaces/lxc.config

      - name: Gerar configuração final
        run: |
          set -e
          make -C kernel O=out $BUILD_FLAGS "$DEFCONFIG"
          make -C kernel O=out $BUILD_FLAGS olddefconfig

      - name: Validar KernelSU-Next + SUSFS
        run: bash magictime/validate-kernelsu-next.sh kernel kernel/out/.config

      - name: Validar perfil LXC/nspawn
        if: ${{ inputs.droidspaces_profile == 'lxc' }}
        run: bash droidspaces/validate-lxc.sh kernel/out/.config

      - name: Compilar Image, dtbs e dtbo.img
        run: |
          set -e
          make -C kernel O=out $BUILD_FLAGS -j"$(nproc)" Image dtbs dtbo.img

      - name: Verificar objetos KernelSU-Next + SUSFS
        run: |
          set -e
          test -f kernel/out/drivers/kernelsu/kernelsu.o
          test -f kernel/out/fs/susfs.o
          test -f kernel/out/arch/arm64/boot/Image
          test -f kernel/out/arch/arm64/boot/dtbo.img
          test -n "$(find kernel/out/arch/arm64/boot/dts/vendor/qcom -type f -name '*.dtb' -print -quit)"

      - name: Coletar artefatos
        run: |
          set -e
          mkdir -p dist
          cp kernel/out/arch/arm64/boot/Image dist/Image
          cp kernel/out/arch/arm64/boot/dtbo.img dist/dtbo.img
          cat kernel/out/arch/arm64/boot/dts/vendor/qcom/*.dtb > dist/dtb
          cp kernel/out/.config dist/kernel-config
          printf '%s\n' '${{ env.MAGIC_SHA }}' > dist/magictime-source-revision
          test -s dist/Image
          test -s dist/dtb
          test -s dist/dtbo.img

      - name: Empacotar AnyKernel3
        run: |
          set -e
          rm -rf ak3_pack
          cp -r anykernel ak3_pack
          cp dist/Image ak3_pack/Image
          cp dist/dtb ak3_pack/dtb
          cp dist/dtbo.img ak3_pack/dtbo.img
          chmod 755 ak3_pack/META-INF/com/google/android/update-binary
          (cd ak3_pack && zip -r -X "../dist/AnyKernel3-Alioth-MagicTime-KSU-Next-SUSFS.zip" .)

      - name: Upload de artefatos
        uses: actions/upload-artifact@v4
        with:
          name: alioth-magictime-ksu-next-susfs-${{ env.MAGIC_SHA }}-${{ inputs.droidspaces_profile }}
          path: dist/
          retention-days: 14
